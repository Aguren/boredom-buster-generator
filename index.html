<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Boredom Buster Generator</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <link rel="stylesheet" href="css/terminal.css"/>
</head>
<body class="theme-playful">

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="toast-container"></div>

  <!-- MAIN APP CONTAINER -->
  <main id="app">

    <!-- HEADER & THEME PICKER -->
    <header class="app-header">
      <div class="logo-area">
        <i class="fa-solid fa-bolt logo-icon"></i>
        <h1>BOREDOM BUSTER</h1>
        <p class="subtitle">FAST ACTIVITIES FOR BUSY PARENTS</p>
      </div>

      <!-- MASTER THEME SELECTOR -->
      <div class="master-theme-picker">
        <label for="master-theme-select">
          <i class="fa-solid fa-wand-magic-sparkles"></i> SELECT THEME:
        </label>
        <select id="master-theme-select" class="theme-tab-dropdown">
          <option value="theme-playful" selected>🎨 Playful Arcade</option>
          <option value="theme-detective">🕵️ Secret Agent</option>
          <option value="theme-space">🚀 Space Explorer</option>
        </select>
      </div>
    </header>

    <!-- STAGE 1: INPUT FORM -->
    <section id="view-generator" class="view-screen active">
      <div class="card glass-panel">
        <form id="generator-form" autocomplete="off">
          
          <!-- ITEM CHIPS SELECTOR -->
          <div class="input-group">
            <label class="section-label">
              <i class="fa-solid fa-box-open"></i> 1. WHAT DO YOU HAVE NEARBY?
            </label>
            <p class="help-text">Tap all the items available in your room right now:</p>
            <div id="item-chips-container" class="chips-grid">
              <!-- Rendered dynamically by ui.js -->
            </div>
          </div>

          <!-- ENERGY LEVEL SELECTOR -->
          <div class="input-group">
            <label for="energy-select" class="section-label">
              <i class="fa-solid fa-battery-charging"></i> 2. ENERGY NEEDED:
            </label>
            <div class="input-wrapper">
              <select id="energy-select" class="custom-select">
                <option value="all">⚡ Any Energy Level</option>
                <option value="high">🔥 High Energy (Burn Steam / Physical)</option>
                <option value="low">🧘 Low Energy (Quiet / Focus Time)</option>
              </select>
            </div>
          </div>

          <!-- SUBMIT BUTTON -->
          <button type="submit" id="btn-generate" class="btn-primary">
            <i class="fa-solid fa-dice"></i>
            <span id="btn-text">BUST BOREDOM!</span>
          </button>
        </form>
      </div>
    </section>

    <!-- STAGE 2: ACTIVITY DISPLAY CARD -->
    <section id="view-activity" class="view-screen hidden">
      <div class="card glass-panel activity-card">
        
        <div class="activity-header">
          <span class="badge prep-badge"><i class="fa-solid fa-stopwatch"></i> Prep: <span id="prep-time">1 min</span></span>
          <span class="badge energy-badge"><i class="fa-solid fa-bolt"></i> <span id="energy-tag">High Energy</span></span>
        </div>

        <h2 id="activity-title" class="activity-title">Activity Title</h2>

        <div class="instructions-block">
          <h3><i class="fa-solid fa-list-check"></i> Instructions:</h3>
          <ol id="activity-steps" class="steps-list"></ol>
        </div>

        <div class="twist-box">
          <div class="twist-title">
            <i class="fa-solid fa-fire"></i> LEVEL UP TWIST:
          </div>
          <p id="activity-twist"></p>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="card-actions">
          <button type="button" id="btn-reroll" class="btn-secondary">
            <i class="fa-solid fa-rotate"></i> Try Another Idea
          </button>
          <button type="button" id="btn-reset" class="btn-primary">
            <i class="fa-solid fa-arrow-left"></i> Change Items
          </button>
        </div>

      </div>
    </section>

  </main>

  <!-- ES MODULE ENTRY POINT -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
